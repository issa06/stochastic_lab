[project]
name = "stochastic-resonance-lab"
version = "2.1.0"
description = "Monte Carlo, Kramers and Fokker-Planck comparison for stochastic resonance"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.1,<4",
  "plotly>=5.20,<8",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
fast = ["numba>=0.61,<1"]
test = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

