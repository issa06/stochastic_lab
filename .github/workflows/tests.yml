name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Check local launcher
        run: |
          bash -n run-macos.command
          python launcher.py --check

